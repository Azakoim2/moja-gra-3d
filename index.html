<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW M5 Highway - Ultra Smooth</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-family: sans-serif; text-shadow: 2px 2px 4px black; z-index: 10;}
        #loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #111; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 24px; font-family: sans-serif; z-index: 20; }
        #loading-bar { width: 300px; height: 20px; border: 2px solid white; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        #loading-fill { width: 0%; height: 100%; background-color: #4CAF50; transition: width 0.2s; }
    </style>
</head>
<body>
    <div id="loading">
        <div id="loading-text">Optymalizacja zasobów... 0%</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>
    <div id="ui">A / D - Skręt | W / S - Gaz/Hamulec</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. USTAWIENIA RENDERERA (WYDAJNOŚĆ)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d1ff);
        scene.fog = new THREE.Fog(0xa3d1ff, 70, 300); // Mgła ogranicza pole widzenia, co przyspiesza grę

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 500);
        
        const renderer = new THREE.WebGLRenderer({ 
            antialias: false, // Wyłączenie antyaliasingu drastycznie zwiększa FPS na słabszych kompach
            powerPreference: "high-performance",
            precision: "lowp" // Niższa precyzja obliczeń kolorów (często niezauważalna, a szybka)
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); // Ograniczenie do 1 zamiast 2 (Retina) oszczędza GPU
        
        // Szybsze cienie
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap; 
        document.body.appendChild(renderer.domElement);

        // OŚWIETLENIE
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(-50, 70, -50);
        dirLight.castShadow = true;
        // Ograniczenie rozdzielczości cieni dla wydajności
        dirLight.shadow.mapSize.width = 512; 
        dirLight.shadow.mapSize.height = 512;
        scene.add(dirLight);

        // AUTOSTRADA
        const roadWidth = 24;
        const worldLength = 400;

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(roadWidth, worldLength * 2), 
            new THREE.MeshLambertMaterial({ color: 0x222222 }) // Lambert jest lżejszy niż StandardMaterial
        );
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(600, worldLength * 2),
            new THREE.MeshLambertMaterial({ color: 0x2e4a22 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // MENEDŻER MODELI
        const modelRegistry = {
            'auto': { url: 'modele/m5.glb', scale: 1.0 },
            'drzewo': { url: 'modele/drzewo.glb', scale: 2.2 },
            'krzak': { url: 'modele/krzak.glb', scale: 1.2 },
            'kamien': { url: 'modele/kamien.glb', scale: 2.5 },
            'barierka': { url: 'modele/barierka.glb', scale: 1.0 }
        };

        const movingObjects = [];
        let playerCar = null;
        let gameReady = false;

        const loader = new THREE.GLTFLoader();
        const manager = new THREE.LoadingManager();
        
        // Ładowanie modeli
        let loadedCount = 0;
        const totalToLoad = Object.keys(modelRegistry).length;

        Object.keys(modelRegistry).forEach(key => {
            new THREE.GLTFLoader().load(modelRegistry[key].url, (gltf) => {
                const model = gltf.scene;
                model.scale.setScalar(modelRegistry[key].scale);
                
                // Optymalizacja materiałów w locie
                model.traverse(n => {
                    if (n.isMesh) {
                        n.castShadow = true;
                        n.matrixAutoUpdate = false; // Wyłączenie ciągłego przeliczania macierzy
                        n.updateMatrix();
                    }
                });
                
                modelRegistry[key].object = model;
                loadedCount++;
                const percent = Math.round((loadedCount / totalToLoad) * 100);
                document.getElementById('loading-fill').style.width = percent + '%';
                document.getElementById('loading-text').innerText = `Optymalizacja: ${percent}%`;

                if(loadedCount === totalToLoad) {
                    document.getElementById('loading').style.display = 'none';
                    initWorld();
                    gameReady = true;
                }
            });
        });

        function spawn(name, x, z) {
            const original = modelRegistry[name].object;
            if(!original) return;
            const clone = original.clone();
            clone.position.set(x, 0, z);
            clone.updateMatrix();
            scene.add(clone);
            movingObjects.push(clone);
            return clone;
        }

        function initWorld() {
            // Auto gracza
            playerCar = modelRegistry['auto'].object.clone();
            playerCar.rotation.y = Math.PI; // Tyłem do kamery
            scene.add(playerCar);

            // Barierki w linii prostej (szczelnie)
            for(let i=0; i<30; i++) {
                spawn('barierka', -roadWidth/2 - 0.5, -i * 15);
                spawn('barierka', roadWidth/2 + 0.5, -i * 15);
            }

            // Otoczenie (mniej obiektów = więcej FPS)
            for(let i=0; i<60; i++) {
                const z = -Math.random() * worldLength;
                const side = Math.random() > 0.5 ? 1 : -1;
                const x = side * (roadWidth/2 + 10 + Math.random() * 40);
                const type = ['drzewo', 'krzak', 'kamien'][Math.floor(Math.random()*3)];
                spawn(type, x, z);
            }

            // Pasy
            for(let i=0; i<20; i++) {
                const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                stripe.rotation.x = -Math.PI/2;
                stripe.position.set(0, 0.05, -i * 25);
                scene.add(stripe);
                movingObjects.push(stripe);
            }
        }

        // STEROWANIE
        const keys = { w:0, a:0, s:0, d:0 };
        window.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k] = 1; });
        window.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k] = 0; });

        let speed = 0;

        function animate() {
            requestAnimationFrame(animate);
            if (!gameReady || !playerCar) return;

            // Fizyka
            if (keys.w) speed += 0.04; 
            else if (keys.s) speed -= 0.05; 
            else speed *= 0.985;
            speed = Math.min(Math.max(speed, 0), 3.5);

            if (speed > 0.1) {
                if (keys.a) playerCar.position.x -= 0.25;
                if (keys.d) playerCar.position.x += 0.25;
            }

            // Bariera fizyczna
            const limit = (roadWidth / 2) - 2;
            playerCar.position.x = Math.max(-limit, Math.min(limit, playerCar.position.x));

            // Ruch świata
            for (let i = 0; i < movingObjects.length; i++) {
                const obj = movingObjects[i];
                obj.position.z += speed;
                
                if (obj.position.z > 30) {
                    obj.position.z -= worldLength;
                }
            }

            // Kamera
            camera.position.set(playerCar.position.x, 6, 15);
            camera.lookAt(playerCar.position.x, 2, -10);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
