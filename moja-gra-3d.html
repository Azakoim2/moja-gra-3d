<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Gra Wyścigowa 3D - Wersja 2.0</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        #instrukcja { 
            position: absolute; top: 20px; width: 100%; text-align: center; 
            color: white; font-family: sans-serif; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; 
        }
    </style>
</head>
<body>
    <div id="instrukcja">Sterowanie: Strzałki lub W, A, S, D<br>Wersja 2.0: Lepsze auto i nierówny teren!</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. SCENA I KAMERA (bez zmian)
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015); // Dodajemy mgłę dla lepszego klimatu!
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. ŚWIATŁO (nieco lepsze cienie)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(50, 100, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x666666));

        // ==========================================
        // NOWOŚĆ 1: LEPSZY MODEL SAMOCHODU
        // ==========================================
        const car = new THREE.Group(); // Grupa, do której dodamy części

        // Karoseria (czerwona)
        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0xcc0000 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.6; // Podnosimy nad ziemię
        car.add(carBody);

        // Dach (szary)
        const roofGeo = new THREE.BoxGeometry(1.8, 0.6, 2);
        const roofMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 1.3, -0.2); // Na górze i lekko z tyłu
        car.add(roof);

        // Funkcja do tworzenia kół
        function createWheel(x, z) {
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            wheelGeo.rotateZ(Math.PI / 2); // Obracamy cylinder, żeby leżał jak koło
            const wheelMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(x, 0.4, z);
            return wheel;
        }

        // Dodajemy 4 koła
        car.add(createWheel(-1.1, 1.2));  // Lewy przód
        car.add(createWheel(1.1, 1.2));   // Prawy przód
        car.add(createWheel(-1.1, -1.2)); // Lewy tył
        car.add(createWheel(1.1, -1.2));  // Prawy tył

        scene.add(car);

        // ==========================================
        // NOWOŚĆ 2: GENEROWANIE POGIĘTEGO TERENU
        // ==========================================
        // Funkcja matematyczna obliczająca wysokość (pagórki)
        function getElevation(x, z) {
            // Używamy sinusa i cosinusa do stworzenia łagodnych wzniesień
            return Math.sin(x * 0.05) * Math.cos(z * 0.05) * 3; 
        }

        // Tworzymy płaszczyznę z dużą ilością segmentów (100x100), żeby mogła się wyginać
        const groundGeometry = new THREE.PlaneGeometry(400, 400, 100, 100);
        const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x2e8b57, wireframe: false }); // Zielony kolor trawy
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;

        // Modyfikujemy punkty (wierzchołki) płaszczyzny, aby stworzyć góry
        const vertices = groundGeometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i];
            const y = vertices[i + 1]; // Dla PlaneGeometry 'y' to nasze 'z' na scenie
            // Przypisujemy nową wysokość
            vertices[i + 2] = getElevation(x, y); 
        }
        groundGeometry.computeVertexNormals(); // Aktualizuje oświetlenie dla krzywizn
        scene.add(ground);

        // 5. STEROWANIE
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let speed = 0;
        const maxSpeed = 1.0; // Trochę szybciej!
        const acceleration = 0.02;
        const steering = 0.04;

        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        const cameraOffset = new THREE.Vector3(0, 4, -8); // Kamera nieco bliżej

        // 6. GŁÓWNA PĘTLA
        function animate() {
            requestAnimationFrame(animate);

            if (keys.ArrowUp || keys.w) speed += acceleration;
            else if (keys.ArrowDown || keys.s) speed -= acceleration;
            else speed *= 0.95;

            speed = Math.max(-maxSpeed / 2, Math.min(maxSpeed, speed));

            if (Math.abs(speed) > 0.01) {
                if (keys.ArrowLeft || keys.a) car.rotation.y += steering * Math.sign(speed);
                if (keys.ArrowRight || keys.d) car.rotation.y -= steering * Math.sign(speed);
            }

            car.translateZ(speed);

            // ==========================================
            // NOWOŚĆ 3: DOPASOWANIE AUTA DO TERENU
            // ==========================================
            // Obliczamy wysokość terenu dokładnie w miejscu, w którym stoi auto
            const terrainHeight = getElevation(car.position.x, car.position.z);
            car.position.y = terrainHeight; // Samochód podskakuje na górkach!

            // Kamera podąża płynnie
            const relativeCameraOffset = cameraOffset.clone().applyMatrix4(car.matrixWorld);
            camera.position.lerp(relativeCameraOffset, 0.1);
            camera.lookAt(car.position);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
